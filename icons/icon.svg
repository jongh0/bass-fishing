<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 배경 그라데이션 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f1f38"/>
      <stop offset="60%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#03060b"/>
    </radialGradient>

    <!-- 레이더 스위프 빔 그라데이션 -->
    <radialGradient id="radarSweep" cx="256" cy="256" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#00e5ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00c853" stop-opacity="0"/>
    </radialGradient>

    <!-- 배스 몸체 그라데이션 -->
    <linearGradient id="bassGrad" x1="20%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#00e5ff"/>
      <stop offset="80%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- 뱃지/링 네온 글로우 필터 -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 배경 (다크 네이비 베이스) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="2"/>

  <!-- 레이더 동심원 (그리드) -->
  <g opacity="0.45">
    <circle cx="256" cy="256" r="200" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="256" cy="256" r="100" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="256" cy="256" r="50"  fill="none" stroke="#10b981" stroke-width="2"/>
    
    <!-- 십자 가이드라인 & 방위각 선 -->
    <line x1="46" y1="256" x2="466" y2="256" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="256" y1="46" x2="256" y2="466" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="108" y1="108" x2="404" y2="404" stroke="#00e5ff" stroke-width="1" stroke-dasharray="4 6" stroke-opacity="0.3"/>
    <line x1="108" y1="404" x2="404" y2="108" stroke="#00e5ff" stroke-width="1" stroke-dasharray="4 6" stroke-opacity="0.3"/>
  </g>

  <!-- 레이더 스위프 부채꼴 섹터 -->
  <path d="M 256 256 L 395 107 A 200 200 0 0 1 456 256 Z" fill="url(#radarSweep)"/>
  <line x1="256" y1="256" x2="456" y2="256" stroke="#00e5ff" stroke-width="2.5" filter="url(#softGlow)"/>

  <!-- 레이더 타깃 블립 (Bite 핑) -->
  <g filter="url(#neonGlow)">
    <!-- 핑 1: 1시 방향 (활성도 높은 피딩 배스) -->
    <circle cx="360" cy="160" r="7" fill="#f59e0b"/>
    <circle cx="360" cy="160" r="15" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.8"/>

    <!-- 핑 2: 7시 방향 -->
    <circle cx="170" cy="340" r="4.5" fill="#10b981"/>
    
    <!-- 핑 3: 4시 방향 -->
    <circle cx="340" cy="350" r="4" fill="#00e5ff"/>
  </g>

  <!-- 중앙 역동적 배스 심볼 라인아트 -->
  <g filter="url(#softGlow)">
    <!-- 배스 실루엣 외곽선 & 바디 (점프하는 공격적 배스 형태) -->
    <path d="M 145 270 
             C 140 230, 175 185, 230 170 
             C 280 155, 335 165, 375 205
             C 385 215, 395 230, 392 240
             C 390 248, 375 245, 362 238
             C 335 225, 295 228, 265 245
             C 240 260, 215 285, 185 295
             C 165 302, 148 290, 145 270 Z" 
          fill="url(#bassGrad)" opacity="0.95"/>

    <!-- 배스 등지느러미 (Dorsal Fin / 스파인) -->
    <path d="M 235 170
             C 245 140, 265 130, 285 132
             C 295 145, 290 160, 288 165
             C 305 145, 325 142, 340 150
             C 345 162, 335 175, 330 180
             C 345 172, 360 175, 368 185
             C 362 195, 350 200, 340 202"
          fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 꼬리지느러미 (Caudal Fin) -->
    <path d="M 148 275
             C 130 255, 105 245, 88 248
             C 98 270, 115 280, 120 285
             C 108 295, 92 312, 85 330
             C 110 320, 132 305, 148 288 Z"
          fill="url(#bassGrad)"/>

    <!-- 아가미 덮개 & 입 (공격적인 오픈 마우스 & 턱) -->
    <path d="M 375 205 
             C 395 210, 420 220, 425 232
             C 415 236, 400 234, 388 232" 
          fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 아래턱 라인 -->
    <path d="M 425 232
             C 410 250, 390 255, 368 250"
          fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
    
    <!-- 아가미선 (Operculum line) -->
    <path d="M 345 220 C 330 235, 335 255, 350 265" fill="none" stroke="#070d18" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 배스 측선 (Lateral Line) - 점선 레이더 펄스 스타일 -->
    <path d="M 155 280 C 205 275, 260 255, 330 235" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.85"/>

    <!-- 배스의 눈 (집중하는 앵글러 타깃 아이) -->
    <circle cx="368" cy="218" r="6" fill="#f59e0b"/>
    <circle cx="368" cy="218" r="2.5" fill="#070d18"/>
    <circle cx="370" cy="216" r="1.2" fill="#ffffff"/>
  </g>

  <!-- 하단 텍스트 뱃지 (BASS RADAR) -->
  <g transform="translate(256, 435)">
    <rect x="-86" y="-18" width="172" height="34" rx="17" fill="#071426" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.8"/>
    <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#00e5ff" letter-spacing="2.5">BASS RADAR</text>
  </g>
</svg>
